<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>养老社区 - PCPartner</title>
<style>
  /* ========== 基础 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Heiti SC", sans-serif;
    color: #333;
    background: #fff;
  }
  .container { max-width: 1140px; margin: 0 auto; padding: 0 15px; }

  /* ========== 顶栏 ========== */
  .site-header { height: 64px; background: #fff; }
  .header-inner { height: 64px; display: flex; align-items: center; }
  .logo { display: flex; align-items: center; gap: 1px; text-decoration: none; }
  .logo-text {
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 33px;
    line-height: 1;
    display: inline-block;
    transform: scaleX(0.85);
    transform-origin: left center;
    margin-right: -24px; /* 补偿 scaleX 后仍占位的横向宽度 */
  }
  .logo-text .logo-pc { color: #009981; font-weight: 900; font-style: normal; }
  .logo-text .logo-partner { color: #A80063; font-weight: 700; font-style: italic; }
  .logo-text sup { font-size: 9px; color: #A80063; }
  .nav { display: flex; gap: 30px; margin-left: 32px; }
  .nav a { font-size: 15px; color: #555; text-decoration: none; }
  .nav a:hover { color: #A80063; }
  .header-right { margin-left: auto; margin-right: 37px; display: flex; align-items: center; gap: 34px; font-size: 15px; color: #555; }
  .header-right a { color: #555; text-decoration: none; }
  .header-right a:hover { color: #A80063; }

  /* ========== 英雄区 ========== */
  .hero {
    height: 285px;
    background: #4a423c url("https://images.unsplash.com/photo-1521791136064-7986c2920216?auto=format&fit=crop&w=1920&q=80") center/cover no-repeat;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.42);
  }
  .hero-content { position: relative; text-align: center; padding-top: 15px; }
  .hero-title {
    font-size: 64px;
    font-weight: 300;
    color: #fff;
    line-height: 1;
    letter-spacing: -4px;
    transform: scaleY(1.28);
    transform-origin: 50% 50%;
  }
  .hero-subtitle { font-size: 20px; color: #fff; line-height: 1.5; margin-top: 2px; }
  .btn-login {
    display: inline-block;
    margin-top: 14px;
    padding: 10px 16px;
    font-size: 17px;
    line-height: 1.42;
    color: #fff;
    background: #5CB85C;
    border-radius: 6px;
    text-decoration: none;
  }
  .btn-login:hover { background: #4CAE4C; }

  /* ========== 三栏特性区 ========== */
  .features { padding: 118px 0 120px; }
  .features .container { display: flex; text-align: center; }
  .feature { flex: 1; padding: 0 15px; }
  .feature .icon-box { height: 92px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
  .feature h3 { font-size: 23px; font-weight: 400; color: #666; margin-bottom: 7px; }
  .feature p { font-size: 13.5px; color: #777; line-height: 1.48; }

  /* ========== 窄屏适配 ========== */
  @media (max-width: 992px) {
    .nav { display: none; }
    .features .container { flex-wrap: wrap; }
    .feature { flex: 1 1 100%; margin-bottom: 48px; }
    .feature:last-child { margin-bottom: 0; }
  }
</style>
</head>
<body>

<!-- 顶栏 -->
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="#">
      <!-- 拼图风标志 -->
      <svg width="47" height="46" viewBox="0 0 47 46" aria-hidden="true">
        <defs>
          <linearGradient id="gTL" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#A80063"/>
          </linearGradient>
          <linearGradient id="gTR" x1="1" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#A80063"/><stop offset="0.75" stop-color="#fff"/>
          </linearGradient>
          <linearGradient id="gBL" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0" stop-color="#A80063"/><stop offset="0.75" stop-color="#fff"/>
          </linearGradient>
          <linearGradient id="gBR" x1="1" y1="1" x2="0" y2="0">
            <stop offset="0.45" stop-color="#fff"/><stop offset="1" stop-color="#A80063"/>
          </linearGradient>
        </defs>
        <rect x="2"  y="2"  width="19" height="19" rx="2.5" fill="url(#gTL)" stroke="#A80063" stroke-width="2.5" transform="rotate(45 12.5 11.5)"/>
        <rect x="25" y="2"  width="19" height="19" rx="2.5" fill="url(#gTR)" transform="rotate(45 34.5 11.5)"/>
        <rect x="2"  y="25" width="19" height="19" rx="2.5" fill="url(#gBL)" transform="rotate(45 12.5 34.5)"/>
        <rect x="25" y="25" width="19" height="19" rx="2.5" fill="url(#gBR)" stroke="#A80063" stroke-width="2.5" transform="rotate(45 34.5 34.5)"/>
      </svg>
      <span class="logo-text"><b class="logo-pc">PC</b><i class="logo-partner">Partner</i><sup>&reg;</sup></span>
    </a>
    <nav class="nav">
      <a href="#">主页</a>
      <a href="#">关于我们</a>
      <a href="#">主要业务</a>
      <a href="#">联系我们</a>
    </nav>
    <div class="header-right">
      <span>电话:15698443151</span>
      <a href="#">管理员登录</a>
    </div>
  </div>
</header>

<!-- 英雄区 -->
<section class="hero">
  <div class="hero-content">
    <h1 class="hero-title">养老社区</h1>
    <p class="hero-subtitle">我国已经进入老龄社会，随着中国同龄人步入老年，将出现第一次老年人口增长高峰。</p>
    <a class="btn-login" href="#">用户登录</a>
  </div>
</section>

<!-- 三栏特性区 -->
<section class="features">
  <div class="container">
    <div class="feature">
      <div class="icon-box">
        <!-- 红：企字圆环 + 速度线 -->
        <svg width="94" height="72" viewBox="0 0 94 72" fill="none" aria-hidden="true">
          <circle cx="36" cy="36" r="33.5" stroke="#DA5B57" stroke-width="3.5"/>
          <text x="36" y="37" font-size="44" font-weight="700" fill="#DA5B57" text-anchor="middle" dominant-baseline="central">企</text>
          <line x1="55" y1="4"  x2="90" y2="4"  stroke="#DA5B57" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="62" y1="18" x2="90" y2="18" stroke="#DA5B57" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="56" y1="52" x2="88" y2="52" stroke="#DA5B57" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="64" y1="66" x2="88" y2="66" stroke="#DA5B57" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h3>丰富的经验积累</h3>
      <p>团队拥有此类项目经验，且团队成员和指导老师皆有一定的能力水平</p>
    </div>
    <div class="feature">
      <div class="icon-box">
        <!-- 橙：三人剪影 -->
        <svg width="94" height="88" viewBox="0 0 94 88" aria-hidden="true">
          <circle cx="25" cy="14" r="14" fill="#EC971F"/>
          <path d="M0.5,88 L0.5,60 Q0.5,38 24,38 Q47,38 47,60 L47,88 Z" fill="#EC971F"/>
          <circle cx="69" cy="14" r="14" fill="#EC971F"/>
          <path d="M93.5,88 L93.5,60 Q93.5,38 70,38 Q47,38 47,60 L47,88 Z" fill="#EC971F"/>
          <circle cx="47" cy="30" r="19" fill="#EC971F" stroke="#fff" stroke-width="4"/>
          <path d="M26,88 L26,73 Q26,53 47,53 Q68,53 68,73 L68,88 Z" fill="#EC971F" stroke="#fff" stroke-width="4"/>
        </svg>
      </div>
      <h3>端到端服务</h3>
      <p>本平台将融合物业、医院、护理、保险、养老、健康六个方面，打造六位一体的新型养老模式</p>
    </div>
    <div class="feature">
      <div class="icon-box">
        <!-- 蓝：柱状图 -->
        <svg width="94" height="80" viewBox="0 0 94 80" aria-hidden="true">
          <rect x="6"    y="41" width="17"   height="34" rx="3.5" fill="#5BC0DE"/>
          <rect x="37"   y="0"  width="18.5" height="75" rx="3.5" fill="#5BC0DE"/>
          <rect x="63.5" y="11" width="17.5" height="64" rx="3.5" fill="#5BC0DE"/>
          <rect x="0"    y="74" width="90"   height="4.5" rx="2"  fill="#5BC0DE"/>
        </svg>
      </div>
      <h3>迅速支援</h3>
      <p>老年人居家养老，出现问题，系统可以快速反应链接对应平台</p>
    </div>
  </div>
</section>

</body>
</html>
